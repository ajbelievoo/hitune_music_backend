open_basedir=/www/wwwroot/web/:/tmp/
upload_max_filesize=256M
post_max_size=256M
memory_limit=512M
; HiTune Distribution — dedicated session cookie name.
; music.hitune.in sets PHPSESSID with Domain=.hitune.in which collides
; with this app's cookie on *.hitune.in hosts and drops logins.
session.name=HWDIST_SESSID
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
