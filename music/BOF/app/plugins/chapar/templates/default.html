<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%WEBSITE_NAME% - Email</title>
</head>
<body style="margin:0;padding:0;background:#0a0a1a;font-family:Google Sans,Roboto,RobotoDraft,Helvetica,Arial,sans-serif;">

  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background:#0a0a1a;">
    <tr>
      <td align="center" style="padding:30px 10px;">
        <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#111122;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.3);">

          <tr>
            <td style="background:linear-gradient(135deg,#0a0a1a 0%,#141428 100%);padding:30px 30px 20px;text-align:center;">
              <a href="%WEBSITE_ADDRESS%" style="display:inline-block;">
                <img src="https://hitune.in/logomusic.png" alt="%WEBSITE_NAME%" style="max-width:180px;height:auto;display:block;margin:0 auto;">
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:35px 30px;background:#1a1a2e;color:#e6e6f0;font-size:15px;line-height:1.6;">
              %EMAIL_CONTENT%
            </td>
          </tr>

          <tr>
            <td style="padding:20px 30px;background:#111122;color:#8a8aa3;font-size:12px;line-height:1.5;text-align:center;border-top:1px solid #252540;">
              <p style="margin:0 0 8px;">%DONT_TALK_BACK%</p>
              <p style="margin:0;">
                <a href="%WEBSITE_ADDRESS%" style="color:#00b7ff;text-decoration:none;font-weight:600;">%WEBSITE_NAME%</a>
                %!UNSUB% · <a href="%UNSUB_LINK%" style="color:#8a8aa3;text-decoration:underline;">%UNSUB_TITLE%</a>%UNSUB!%
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
